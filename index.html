<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Feedback</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --black:#000;
  --white:#fff;
  --soft:#d5d5d5;
  --muted:#777;
  --line:#292929;
}

body{
  min-height:100vh;
  background:var(--black);
  color:var(--white);
  font-family:"Space Grotesk",sans-serif;
  padding:30px 18px;
  overflow-x:hidden;
}

body::selection{
  background:#fff;
  color:#000;
}

.page{
  width:min(100%,760px);
  margin:auto;
}

/* top */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:20px;
  border-bottom:1px solid var(--white);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:58px;
  height:58px;
  border:1px solid #fff;
  border-radius:50%;
  object-fit:cover;
  filter:grayscale(1);
  transition:.35s ease;
}

.logo:hover{
  transform:rotate(8deg) scale(1.06);
}

.brand-name{
  font-family:"DM Mono",monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:#aaa;
  font:10px "DM Mono",monospace;
  letter-spacing:1px;
  text-transform:uppercase;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{opacity:.3;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.2)}
}

/* hero */
.hero{
  padding:68px 0 48px;
}

.eyebrow{
  color:#999;
  font:10px "DM Mono",monospace;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:14px;
}

h1{
  font-family:"Bebas Neue",sans-serif;
  font-size:clamp(70px,15vw,135px);
  font-weight:400;
  line-height:.78;
  letter-spacing:2px;
  text-transform:uppercase;
}

h1 span{
  display:inline-block;
  transition:.25s ease;
}

h1 span:hover{
  transform:translateX(10px);
}

.hero p{
  max-width:560px;
  color:#aaa;
  font-size:15px;
  line-height:1.7;
  margin-top:25px;
}

/* form */
.form{
  border-top:1px solid var(--line);
}

.field{
  padding:27px 0;
  border-bottom:1px solid var(--line);
  transition:.25s;
}

.field:focus-within{
  padding-left:12px;
  border-bottom-color:#fff;
}

label{
  display:block;
  color:#777;
  font:10px "DM Mono",monospace;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:12px;
  transition:.2s;
}

.field:focus-within label{
  color:#fff;
}

input,textarea{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font:18px "Space Grotesk",sans-serif;
}

input::placeholder,textarea::placeholder{
  color:#414141;
}

textarea{
  min-height:135px;
  resize:vertical;
  line-height:1.6;
}

/* rating */
.rating-area{
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
}

.stars{
  display:flex;
  flex-direction:row-reverse;
  justify-content:flex-end;
  gap:3px;
}

.stars input{
  display:none;
}

.stars label{
  margin:0;
  cursor:pointer;
  font-family:Arial,sans-serif;
  font-size:34px;
  color:#333;
  letter-spacing:0;
  transition:.15s ease;
}

.stars label:hover,
.stars label:hover~label,
.stars input:checked~label{
  color:#fff;
  transform:translateY(-3px);
}

.rating-text{
  color:#777;
  font:10px "DM Mono",monospace;
  min-width:105px;
}

/* button */
.submit-wrap{
  padding-top:30px;
}

button{
  position:relative;
  width:100%;
  height:62px;
  overflow:hidden;
  border:1px solid #fff;
  background:#fff;
  color:#000;
  cursor:pointer;
  font:500 11px "DM Mono",monospace;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.25s;
}

button::before{
  content:"";
  position:absolute;
  inset:0;
  background:#000;
  transform:translateX(-101%);
  transition:.3s ease;
}

button span{
  position:relative;
  z-index:1;
}

button:hover{
  color:#fff;
}

button:hover::before{
  transform:translateX(0);
}

button:active{
  transform:scale(.985);
}

button:disabled{
  opacity:.55;
  cursor:wait;
}

/* status */
.status{
  display:none;
  margin-bottom:15px;
  padding:15px;
  border:1px solid #fff;
  color:#fff;
  font:11px "DM Mono",monospace;
  line-height:1.6;
}

.status.show{
  display:block;
}

/* footer */
.footer{
  display:flex;
  justify-content:space-between;
  padding:28px 0 10px;
  color:#555;
  font:9px "DM Mono",monospace;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

@media(max-width:600px){
  body{padding:20px 15px}
  .hero{padding:55px 0 38px}
  h1{font-size:76px}
  .hero p{font-size:14px}
  .field{padding:23px 0}
  .field:focus-within{padding-left:7px}
  .rating-area{gap:12px}
  .stars label{font-size:31px}
  .footer{flex-direction:column;gap:9px}
}
</style>
</head>

<body>

<main class="page">

  <header class="topbar">
    <div class="brand">
      <img class="logo" src="om.jpg" alt="Logo">
      <div class="brand-name">Feedback</div>
    </div>

    <div class="live">
      <span class="dot"></span>
      Open
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">I'd love to hear from you</div>

    <h1>
      <span>Tell</span><br>
      <span>Me.</span>
    </h1>

    <p>
      Whether it's an idea, a suggestion, a problem, or simply something
      you liked — every piece of feedback matters.
    </p>
  </section>

  <!-- Replace the action URL with your Formspree endpoint -->
  <form
  class="form"
  id="feedbackForm"
  action="https://formspree.io/f/xeaoejae"
  method="POST"
>

    <div class="field">
      <label for="name">Your name</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="What's your name?"
        autocomplete="name"
        required
      >
    </div>

    <div class="field">
      <label for="email">Your email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Where can I reach you?"
        autocomplete="email"
        required
      >
    </div>

    <div class="field">
      <label>Your experience</label>

      <div class="rating-area">
        <div class="stars">

          <input id="star5" type="radio" name="rating" value="5" required>
          <label for="star5">★</label>

          <input id="star4" type="radio" name="rating" value="4">
          <label for="star4">★</label>

          <input id="star3" type="radio" name="rating" value="3">
          <label for="star3">★</label>

          <input id="star2" type="radio" name="rating" value="2">
          <label for="star2">★</label>

          <input id="star1" type="radio" name="rating" value="1">
          <label for="star1">★</label>

        </div>

        <div class="rating-text" id="ratingText">
          Pick a rating
        </div>
      </div>
    </div>

    <div class="field">
      <label for="message">Your thoughts</label>

      <textarea
        id="message"
        name="message"
        placeholder="Don't hold back..."
        required
      ></textarea>
    </div>

    <input type="hidden" name="_subject" value="New Feedback Received">
    <input type="text" name="_gotcha" style="display:none">

    <div class="submit-wrap">

      <div id="status" class="status"></div>

      <button id="submitBtn" type="submit">
        <span>Send feedback →</span>
      </button>

    </div>

  </form>

  <footer class="footer">
    <span>Thanks for sharing</span>
    <span>Made with care</span>
  </footer>

</main>

<script>
const form = document.getElementById("feedbackForm");
const button = document.getElementById("submitBtn");
const status = document.getElementById("status");
const ratingText = document.getElementById("ratingText");

const ratingMessages = {
  1:"Could be better",
  2:"Needs improvement",
  3:"It was okay",
  4:"Really good",
  5:"Absolutely loved it"
};

document.querySelectorAll('input[name="rating"]').forEach(radio=>{
  radio.addEventListener("change",()=>{
    ratingText.textContent = ratingMessages[radio.value];
  });
});

form.addEventListener("submit", async event=>{
  event.preventDefault();

  if(form.action.includes("REPLACE_WITH_YOUR_FORM_ID")){
    status.className="status show";
    status.textContent="Email service is not connected yet. Add your Formspree endpoint.";
    return;
  }

  button.disabled=true;
  button.querySelector("span").textContent="Sending...";

  try{
    const response=await fetch(form.action,{
      method:"POST",
      body:new FormData(form),
      headers:{Accept:"application/json"}
    });

    if(!response.ok) throw new Error();

    status.className="status show";
    status.textContent="✓ Feedback received. Thank you for sharing.";

    form.reset();
    ratingText.textContent="Pick a rating";

  }catch(error){
    status.className="status show";
    status.textContent="Something went wrong. Please try again.";
  }finally{
    button.disabled=false;
    button.querySelector("span").textContent="Send feedback →";
  }
});
</script>

</body>
</html>
