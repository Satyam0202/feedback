<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #000000;
    --card-bg: #0a0a0a;
    --text-primary: #ffffff;
    --text-secondary: #888888;
    --border-color: #222222;
    --hover-bg: #1a1a1a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    width: 100%;
    max-width: 440px;
    padding: 32px 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    position: relative;
    text-align: center;
  }

  /* Header Profile / Logo */
  .profile-container {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid var(--text-primary);
    padding: 2px;
    background: var(--bg-main);
  }

  .profile-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    filter: grayscale(100%);
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 28px;
    padding: 0 8px;
  }

  /* Star Rating System */
  .stars-container {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .stars-container input {
    display: none;
  }

  .stars-container label {
    font-size: 32px;
    color: #333333;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.2s ease;
    user-select: none;
    line-height: 1;
  }

  .stars-container label:hover,
  .stars-container label:hover ~ label,
  .stars-container input:checked ~ label {
    color: var(--text-primary);
  }

  .stars-container label:hover {
    transform: scale(1.15);
  }

  /* Status Tag Below Rating */
  .status-tag {
    display: inline-block;
    background: var(--text-primary);
    color: var(--bg-main);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 24px;
    min-width: 90px;
  }

  /* Input Fields */
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .input-field {
    width: 100%;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .input-field:focus {
    border-color: var(--text-primary);
  }

  textarea.input-field {
    min-height: 100px;
    resize: none;
  }

  /* Submit Button */
  .submit-btn {
    width: 100%;
    background: var(--text-primary);
    color: var(--bg-main);
    border: 1px solid var(--text-primary);
    border-radius: 12px;
    padding: 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .submit-btn:hover {
    background: var(--bg-main);
    color: var(--text-primary);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: wait;
  }

  .notice {
    display: none;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<div class="card">
  <!-- Profile Picture -->
  <div class="profile-container">
    <img src="img.jpg" alt="Profile" class="profile-img" onerror="this.src='https://via.placeholder.com/64/000000/FFFFFF?text=YOU'">
  </div>

  <h1 class="title">How are you feeling?</h1>
  <p class="subtitle">Your input is valuable in helping us better understand your needs and tailor our service accordingly.</p>

  <form id="feedbackForm" action="https://script.google.com/macros/s/AKfycbx7N0bd8QxGvOG5Tl6Psk2LKoMkDFyJgvhhtltxVe0IRQfyaWwsiTz7RDCCZDllEgTp/exec" method="POST" target="feedbackFrame">

    <!-- Star Rating System -->
    <div class="stars-container">
      <input type="radio" id="star5" name="rating" value="5" data-text="5 Stars - Excellent" required>
      <label for="star5" title="5 Stars">★</label>

      <input type="radio" id="star4" name="rating" value="4" data-text="4 Stars - Good">
      <label for="star4" title="4 Stars">★</label>

      <input type="radio" id="star3" name="rating" value="3" data-text="3 Stars - Average" checked>
      <label for="star3" title="3 Stars">★</label>

      <input type="radio" id="star2" name="rating" value="2" data-text="2 Stars - Poor">
      <label for="star2" title="2 Stars">★</label>

      <input type="radio" id="star1" name="rating" value="1" data-text="1 Star - Very Bad">
      <label for="star1" title="1 Star">★</label>
    </div>

    <div class="status-tag" id="statusTag">3 Stars - Average</div>

    <!-- User Details -->
    <div class="field-group">
      <input type="text" name="name" class="input-field" placeholder="Your Name" required>
      <input type="email" name="email" class="input-field" placeholder="Your Email" required>
      <textarea name="message" class="input-field" placeholder="Add a comment..." required></textarea>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">Submit Now</button>
    <div id="notice" class="notice"></div>
  </form>

  <iframe name="feedbackFrame" id="feedbackFrame" style="display:none;"></iframe>
</div>

<script>
  const statusTag = document.getElementById('statusTag');
  const form = document.getElementById('feedbackForm');
  const submitBtn = document.getElementById('submitBtn');
  const notice = document.getElementById('notice');

  // Dynamic Status Label Update on Star Selection
  document.querySelectorAll('input[name="rating"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      statusTag.textContent = e.target.getAttribute('data-text');
    });
  });

  // Submit Handler
  form.addEventListener('submit', () => {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    notice.style.display = 'block';
    notice.textContent = 'Sending your response...';

    setTimeout(() => {
      form.reset();
      statusTag.textContent = '3 Stars - Average';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Now';
      notice.textContent = '✓ Response submitted successfully.';
    }, 1500);
  });
</script>

</body>
</html>
